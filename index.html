<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chordic Lite - Chordastic Style</title>
    <style>
        :root {
            --primary-color: #20B2AA; /* LightSeaGreen - liknar Chordastic */
            --bg-color: #f4f4f9;
            --text-color: #333;
            --border-color: #ccc;
            --chord-color: #d32f2f; /* Röd för ackord för tydlighet */
            --a4-width: 210mm;
            --a4-height: 297mm;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .toolbar {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: white;
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e0f7fa;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden; /* Förhindrar scroll på hela kroppen */
        }

        /* Vänster panel: A4-visning */
        .preview-pane {
            flex: 2;
            padding: 20px;
            overflow-y: auto;
            background-color: #555; /* Mörk bakgrund för att framhäva pappret */
            display: flex;
            justify-content: center;
        }

        .a4-page {
            background: white;
            width: var(--a4-width);
            min-height: var(--a4-height);
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Monospace för att hålla kollonner */
            font-size: 14pt;
            line-height: 1.6;
            white-space: pre-wrap; /* Behåller mellanrum och rader */
            position: relative;
        }

        .chord {
            color: var(--chord-color);
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
        }

        .chord:hover {
            text-decoration: underline;
        }

        /* Höger panel: Editor */
        .editor-pane {
            flex: 1;
            background-color: white;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        .editor-header {
            padding: 10px;
            background-color: #eee;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14pt;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        /* Dold filinput */
        #fileInput { display: none; }

        /* Instruktionsruta */
        .instructions {
            font-size: 0.8rem;
            color: #666;
            padding: 10px;
            background: #fff3cd;
            border-bottom: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<header>
    <h1>Chordic Lite</h1>
    <div class="toolbar">
        <button onclick="exportChordPro()">📤 Exportera ChordPro</button>
        <button onclick="document.getElementById('fileInput').click()">📥 Importera ChordPro</button>
        <input type="file" id="fileInput" accept=".txt,.pro,.crd" onchange="importChordPro(this)">
        <button onclick="clearAll()">🗑️ Rensa</button>
    </div>
</header>

<div class="main-container">
    <!-- Vänster: Visning (A4) -->
    <div class="preview-pane">
        <div id="preview" class="a4-page"></div>
    </div>

    <!-- Höger: Redigering (Alltid synlig) -->
    <div class="editor-pane">
        <div class="editor-header">Redigera Text & Ackord</div>
        <div class="instructions">
            Skriv text. Sätt ackord inom hakparenteser, t.ex: <br>
            <code>[Am]Hej [Dm]där [G]du</code><br>
            Ackord efter sista bokstaven funkar också: <code>Hej där[Am][G]</code>
        </div>
        <textarea id="editor" placeholder="Skriv dina låttexter här..." oninput="updatePreview()"></textarea>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    // Uppdaterar vyn baserat på editorns innehåll
    function updatePreview() {
        const text = editor.value;
        // Regex hittar allt inom [] och gör det till en span-tagga för styling
        // Vi använder 'g' för global (alla förekomster)
        const formattedText = text.replace(/\[(.*?)\]/g, '<span class="chord">$1</span>');
        preview.innerHTML = formattedText;
    }

    // Exportera till ChordPro-fil
    function exportChordPro() {
        const text = editor.value;
        if (!text.trim()) {
            alert("Ingen text att exportera!");
            return;
        }

        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'låttext.chopro'; // Standardändelse för ChordPro
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Importera från ChordPro-fil
    function importChordPro(inputElement) {
        const file = inputElement.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        reader.onload = function(e) {
            const content = e.target.result;
            // Sätt in innehållet direkt i editorn
            editor.value = content;
            // Uppdatera vyn direkt
            updatePreview();
            
            // Återställ input så samma fil kan väljas igen om nödvändigt
            inputElement.value = ''; 
        };

        reader.onerror = function() {
            alert("Ett fel uppstod vid läsning av filen.");
        };

        // Läs filen som text
        reader.readAsText(file);
    }

    function clearAll() {
        if(confirm("Vill du rensa allt?")) {
            editor.value = '';
            updatePreview();
        }
    }

    // Initiera med en exempeltext om tom
    window.onload = function() {
        const example = "[C]Hej på dig\n[Dm]Detta är en test[G]rad[C]\nOch en rad utan ackord i slutet[Am][G]";
        // Vi sätter inte exemplet automatiskt så användaren ser sin egen data först, 
        // men om du vill ha det kvar vid refresh kan du aktivera nedan:
        // editor.value = example;
        // updatePreview();
    };
</script>

</body>
</html>
