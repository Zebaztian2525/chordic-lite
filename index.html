<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎵 Chordic Lite</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    :root {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
        background: linear-gradient(135deg, #1a6b7c 0%, #0d3f4c 100%);
        margin: 0; padding: 14px; min-height: 100vh; color: #1a3d47;
    }

    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 8px;
        background: #f0fafc; border: 3px solid #7ec4d0;
        border-radius: 20px; padding: 10px 18px; margin-bottom: 12px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .topbar h1 { margin: 0; font-size: 1.3rem; color: #0d3f4c; letter-spacing: 0.5px; white-space: nowrap; }
    .song-input {
        padding: 6px 12px; border: 2px solid #7ec4d0; border-radius: 20px;
        font-size: 0.9rem; font-weight: bold; background: #fff; color: #0d3f4c;
        min-width: 100px; flex: 1 1 130px;
    }
    .song-input.artist-input { max-width: 180px; }
    .song-input.title-input  { max-width: 240px; flex: 1 1 180px; }
    .song-input:focus { outline: none; border-color: #1a6b7c; }

    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
    .toolbar button {
        background: #d3e9ed; border: none; border-radius: 30px;
        padding: 8px 14px; font-size: 0.85rem; font-weight: bold;
        color: #0d3f4c; cursor: default; transition: 0.15s;
    }
    .toolbar button:hover { background: #a8d5dd; transform: translateY(-1px); }
    .toolbar button:active { transform: translateY(0); }

    .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr) 400px;
        gap: 12px;
        align-items: start;
    }
    @media (max-width: 1300px) {
        .layout { grid-template-columns: 1fr; }
    }

    .sidebar {
        display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 1301px) {
        .sidebar {
            position: sticky; top: 14px;
            max-height: calc(100vh - 28px);
            overflow-y: auto; padding-right: 2px;
        }
    }

    .right-column {
        display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 1301px) {
        .right-column {
            position: sticky; top: 14px;
            max-height: calc(100vh - 28px);
            overflow-y: auto; padding-right: 2px;
        }
    }

    .main {
        display: flex; flex-direction: column; gap: 12px;
        min-width: 0;
    }

    .panel {
        background: #f0fafc; border: 3px solid #7ec4d0;
        border-radius: 16px; padding: 14px 16px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        display: flex; flex-direction: column; gap: 10px;
    }
    .panel-title {
        font-size: 0.8rem; font-weight: bold; color: #0d3f4c;
        text-transform: uppercase; letter-spacing: 0.6px;
        margin: 0 0 2px;
    }

    .info-bar {
        text-align: center;
        color: #d9eef3;
        font-size: 0.82rem;
        font-style: italic;
        background: rgba(13,63,76,0.35);
        padding: 8px 14px;
        border-radius: 12px;
        border: 2px solid rgba(126,196,208,0.4);
        line-height: 1.6;
    }
    .info-bar kbd {
        background: #0d3f4c; color: #fff;
        padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;
        font-family: 'Courier New', monospace;
    }

    .key-panel { display: flex; flex-direction: column; gap: 6px; }
    .key-label { font-size: 0.85rem; color: #0d3f4c; font-weight: bold; }
    .keyboard { position: relative; height: 56px; width: 100%; user-select: none; }
    .white-keys { display: flex; height: 100%; position: absolute; inset: 0; }
    .piano-key.white {
        flex: 1; background: #fff; border: 1px solid #7ec4d0;
        border-radius: 0 0 4px 4px; cursor: default;
        display: flex; align-items: flex-end; justify-content: center;
        padding-bottom: 3px; font-size: 0.6rem; color: #5c8d96;
        transition: background 0.1s;
    }
    .piano-key.white:hover { background: #e6f4f7; }
    .piano-key.white.active { background: #7ec4d0; color: #fff; }
    .piano-key.black {
        position: absolute; top: 0; width: 14px; height: 60%;
        background: #0d3f4c; border-radius: 0 0 3px 3px;
        cursor: default; z-index: 1; transition: background 0.1s;
    }
    .piano-key.black:hover { background: #1a6b7c; }
    .piano-key.black.active { background: #ff8a5c; }

    .chord-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chord-chip {
        background: #1a5f6e; color: #fff; border-radius: 18px;
        padding: 5px 12px; font-size: 0.85rem; font-weight: bold;
        cursor: default; user-select: none; touch-action: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: background 0.1s, transform 0.1s;
        border: none;
    }
    .chord-chip:hover { background: #0d3f4c; transform: translateY(-1px); }
    .chord-chip.dragging { opacity: 0.4; }
    .chord-chip.minor { background: #2a8fa1; }
    .chord-chip.dim { background: #5c8d96; }

    .builder-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .builder-row-label {
        font-size: 0.72rem; color: #5c8d96; font-weight: bold;
        width: 62px; flex-shrink: 0; padding-top: 4px;
    }
    .builder-chips { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    .mini-chip {
        background: #d3e9ed; color: #0d3f4c; border: none;
        border-radius: 14px; padding: 4px 10px; font-size: 0.78rem;
        font-weight: bold; cursor: default; transition: 0.1s;
    }
    .mini-chip:hover { background: #a8d5dd; }
    .mini-chip.active { background: #1a5f6e; color: #fff; }
    .mini-chip.none-chip { font-style: italic; }
    .builder-preview-row {
        display: flex; align-items: center; gap: 10px; margin-top: 4px;
        padding-top: 10px; border-top: 1px dashed #a8d5dd;
        flex-wrap: wrap;
    }
    .builder-preview-chip {
        background: #ff8a5c; color: #fff; border-radius: 18px;
        padding: 6px 16px; font-size: 1rem; font-weight: bold;
        cursor: default; user-select: none; touch-action: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .builder-preview-chip.dragging { opacity: 0.4; }
    .builder-add-btn {
        background: #1a5f6e; color: #fff; border: none;
        border-radius: 20px; padding: 7px 16px;
        font-weight: bold; cursor: default; font-size: 0.85rem;
    }
    .builder-add-btn:hover { filter: brightness(0.9); }

    .library-list {
        list-style: none; padding: 0; margin: 0;
        max-height: 220px; overflow-y: auto;
        border: 1px dashed #a8d5dd; border-radius: 8px;
    }
    .library-list li {
        padding: 6px 10px; font-size: 0.85rem; color: #0d3f4c;
        cursor: default; border-bottom: 1px solid #e0eef1;
    }
    .library-list li:last-child { border-bottom: none; }
    .library-list li:hover { background: #d3e9ed; }
    .library-list li.active { background: #7ec4d0; color: #fff; font-weight: bold; }
    .library-list li.empty {
        color: #5c8d96; font-style: italic; cursor: default;
    }
    .library-list li.empty:hover { background: transparent; }
    .library-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .library-buttons button {
        background: #d3e9ed; border: none; border-radius: 20px;
        padding: 6px 12px; font-size: 0.78rem; font-weight: bold;
        color: #0d3f4c; cursor: default; transition: 0.15s;
    }
    .library-buttons button:hover { background: #a8d5dd; }
    .library-note {
        font-size: 0.7rem; color: #5c8d96; font-style: italic;
        line-height: 1.3;
    }

    .song {
        background: #fff; border: 3px solid #7ec4d0;
        border-radius: 16px; padding: 24px 28px;
        font-family: 'Courier New', monospace; font-size: 1rem;
        line-height: 1.2; min-height: 600px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.3); color: #0d3f4c;
        overflow-x: auto; max-width: 210mm; margin: 0 auto; width: 100%;
    }
    .song-header {
        text-align: center;
        margin: 0 0 30px;
        padding-bottom: 18px;
        border-bottom: 2px solid #e0eef1;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    .song-header.empty { display: none; }
    .song-header .artist {
        font-size: 1rem;
        color: #5c8d96;
        font-weight: 600;
        margin-bottom: 4px;
    }
    .song-header .title {
        font-size: 1.5rem;
        color: #0d3f4c;
        font-weight: bold;
        margin: 0;
    }

    .line { margin-bottom: 14px; min-height: 2em; }
    .word-wrap { display: inline; white-space: nowrap; }

    .char {
        display: inline-block; position: relative;
        padding-top: 1.5em;
        user-select: none;
    }
    .char .lyric {
        display: inline-block;
        cursor: default;
        border-radius: 3px;
        padding: 0 1px;
    }
    .char .lyric:hover { background: #e6f4f7; }
    .char.selected .lyric {
        background: #ffe9c4;
        outline: 2px solid #ff8a5c;
        outline-offset: 0;
    }
    .char.dragover { background: #c4e8ee; border-radius: 3px; }
    .char .chord {
        position: absolute; top: 0; left: 0;
        font-weight: bold; color: #1a5f6e;
        font-size: 0.9rem; font-family: 'Segoe UI', sans-serif;
        white-space: nowrap; cursor: default;
        padding: 1px 2px; border-radius: 3px; line-height: 1;
        touch-action: none;
    }
    .char .chord::before {
        content: '';
        position: absolute;
        top: -6px; right: -8px; bottom: -6px; left: -8px;
    }
    .char .chord:hover { background: #c4e8ee; }
    .char .chord.dragging { opacity: 0.35; cursor: default; }

    .char .lyric.spacer {
        visibility: hidden;
        font-size: 0.9rem;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-weight: bold;
        white-space: nowrap;
        padding-right: 10px;
    }

    .editor-panel {
        display: flex; flex-direction: column; gap: 10px;
    }
    .editor-panel .editor-header {
        font-weight: bold; color: #0d3f4c; font-size: 0.9rem;
    }
    .editor-panel textarea {
        width: 100%; padding: 12px;
        border: 2px solid #7ec4d0; border-radius: 10px;
        font-family: 'Courier New', monospace; font-size: 0.9rem;
        background: #fff; resize: vertical; color: #0d3f4c;
        line-height: 1.5;
        min-height: 500px;
    }
    .editor-panel textarea:focus { outline: none; border-color: #1a6b7c; }
    .editor-panel .editor-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .editor-panel .editor-buttons button {
        background: #1a5f6e; color: #fff; border: none;
        border-radius: 20px; padding: 6px 16px;
        font-weight: bold; cursor: default; font-size: 0.85rem;
    }
    .editor-panel .editor-buttons button.cancel { background: #5c8d96; }
    .editor-panel .editor-buttons button:hover { filter: brightness(0.9); }

    .ghost {
        position: fixed; z-index: 1000; pointer-events: none;
        background: #1a5f6e; color: #fff; border-radius: 18px;
        padding: 5px 12px; font-weight: bold; font-size: 0.85rem;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        transform: translate(-50%, -150%);
    }

    .confirm-overlay {
        position: fixed; inset: 0; background: rgba(13,63,76,0.55);
        display: none; align-items: center; justify-content: center;
        z-index: 200;
    }
    .confirm-overlay.visible { display: flex; }
    .confirm-box {
        background: #f0fafc; border: 3px solid #7ec4d0; border-radius: 16px;
        padding: 22px 26px; max-width: 320px; text-align: center;
        box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .confirm-box p { margin: 0 0 16px; color: #0d3f4c; font-weight: bold; }
    .confirm-buttons { display: flex; justify-content: center; gap: 10px; }
    .confirm-buttons button {
        border: none; border-radius: 20px; padding: 8px 20px;
        font-weight: bold; cursor: default; font-size: 0.9rem; color: #fff;
    }
    .confirm-buttons .confirm-yes { background: #ff8a5c; }
    .confirm-buttons .confirm-no { background: #5c8d96; }
    .confirm-buttons button:hover { filter: brightness(0.9); }

    .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
        background: #0d3f4c; color: #fff; padding: 10px 20px; border-radius: 30px;
        font-weight: bold; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
        z-index: 300;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media print {
        body { background: #fff; padding: 0; }
        .topbar, .sidebar, .right-column, .info-bar,
        .confirm-overlay, .toast { display: none !important; }
        .layout { display: block; }
        .main { display: block; }
        .song {
            border: none; box-shadow: none;
            background: #fff; padding: 0; color: #000;
            max-width: 100%;
        }
        .song-header { border-bottom: none; margin-bottom: 20px; }
        .char .chord { color: #000; }
        .char.selected .lyric { background: transparent; outline: none; }
    }
</style>
</head>
<body>

<div class="topbar">
    <h1>🎵 Chordic Lite</h1>
    <input type="text" class="song-input artist-input" id="songArtist"
           placeholder="Artist..." autocomplete="off" spellcheck="false">
    <input type="text" class="song-input title-input" id="songTitle"
           placeholder="Låtens namn..." autocomplete="off" spellcheck="false">
    <div class="toolbar">
        <button id="transDownBtn" title="Transponera ner ett halvt steg">−½</button>
        <button id="transUpBtn" title="Transponera upp ett halvt steg">+½</button>
        <button id="exportChordProBtn" title="Exportera som ChordPro">📤 ChordPro</button>
        <button id="importChordProBtn" title="Importera ChordPro-fil">📥 ChordPro</button>
        <button id="printBtn">🖨️ PDF</button>
        <button id="clearChordsBtn">🗑 Rensa ackord</button>
    </div>
</div>

<div class="layout">

    <aside class="sidebar">

        <div class="panel">
            <div class="key-panel">
                <span class="key-label">Tonart: <span id="currentKeyLabel">C</span></span>
                <div class="keyboard" id="keyboard">
                    <div class="white-keys" id="whiteKeys"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <p class="panel-title">Diatoniska ackord</p>
            <div class="chord-chips" id="paletteChips"></div>
        </div>

        <div class="panel">
            <p class="panel-title">🛠️ Bygg eget ackord</p>
            <div class="builder-row">
                <span class="builder-row-label">Grundton</span>
                <div class="builder-chips" id="builderRoots"></div>
            </div>
            <div class="builder-row">
                <span class="builder-row-label">Typ</span>
                <div class="builder-chips" id="builderQualities"></div>
            </div>
            <div class="builder-row">
                <span class="builder-row-label">Basnot</span>
                <div class="builder-chips" id="builderBass"></div>
            </div>
            <div class="builder-preview-row">
                <div class="builder-preview-chip" id="builderPreviewChip">C</div>
                <button class="builder-add-btn" id="builderAddBtn">Lägg till</button>
            </div>
        </div>

    </aside>

    <main class="main">
        <div class="info-bar">
            🖱️ Dra ackord från palett/byggare till en bokstav &nbsp;|&nbsp;
            ↔ Dra ett fastsatt ackord för att flytta &nbsp;|&nbsp;
            <kbd>Ctrl</kbd> + klicka på ett ackord för att ta bort
        </div>
        <div class="song" id="song">
            <div class="song-header empty" id="songHeader"></div>
            <div class="song-body" id="songBody"></div>
        </div>
    </main>

    <aside class="right-column">

        <div class="panel editor-panel">
            <div class="editor-header">✏️ Redigera text</div>
            <textarea id="lyricsText" spellcheck="false"
                      placeholder="Skriv eller klistra in låttexten här..."></textarea>
            <div class="editor-buttons">
                <button class="cancel" id="resetLyricsBtn">Återställ</button>
                <button id="applyLyricsBtn">Spara text</button>
            </div>
        </div>

        <div class="panel">
            <p class="panel-title">📚 Bibliotek</p>
            <ul class="library-list" id="libraryList">
                <li class="empty">Ingen mapp vald</li>
            </ul>
            <div class="library-buttons">
                <button id="pickLibraryBtn">📁 Välj mapp</button>
                <button id="saveToLibraryBtn">💾 Spara i mapp</button>
                <button id="openFileBtn">📂 Öppna fil</button>
                <button id="downloadBtn">⬇ Ladda ner</button>
            </div>
            <p class="library-note" id="libraryNote"></p>
        </div>

    </aside>

</div>

<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p id="confirmMessage"></p>
        <div class="confirm-buttons">
            <button class="confirm-no" id="confirmNoBtn">Avbryt</button>
            <button class="confirm-yes" id="confirmYesBtn">OK</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput"
       accept=".json,.chordic.json,.pro,.chordpro,.crd,.cho,.chopro,.txt"
       style="display:none">

<script>
(function() {
    'use strict';

    const STORAGE_KEY = 'chordic_lite_v5';
    const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const MAJOR_INTERVALS = [0, 2, 4, 5, 7, 9, 11];
    const CHORD_QUALITIES = ['', 'm', 'm', '', '', 'm', 'dim'];
    const BUILDER_QUALITIES = [
        { label: 'dur',  value: '' },
        { label: 'm',    value: 'm' },
        { label: '7',    value: '7' },
        { label: 'm7',   value: 'm7' },
        { label: 'maj7', value: 'maj7' },
        { label: '9',    value: '9' },
        { label: 'm9',   value: 'm9' },
        { label: 'maj9', value: 'maj9' },
        { label: '6',    value: '6' },
        { label: 'm6',   value: 'm6' },
        { label: 'add9', value: 'add9' },
        { label: 'sus2', value: 'sus2' },
        { label: 'sus4', value: 'sus4' },
        { label: 'dim',  value: 'dim' },
        { label: 'dim7', value: 'dim7' },
        { label: 'm7b5', value: 'm7b5' },
        { label: 'aug',  value: 'aug' },
        { label: '11',   value: '11' },
        { label: '13',   value: '13' }
    ];
    const DRAG_THRESHOLD = 5;

    const DEFAULT_LYRICS =
        "Amazing grace how sweet the sound\n" +
        "That saved a wretch like me\n" +
        "I once was lost but now am found\n" +
        "Was blind but now I see";

    let state = {
        title: 'Min låt',
        artist: '',
        lyrics: DEFAULT_LYRICS,
        chords: [],
        key: 'C',
        selectedChar: null
    };

    let builder = { root: 'C', quality: '', bass: null };
    let libraryDirHandle = null;
    let currentLibraryFile = null;

    const songHeaderEl = document.getElementById('songHeader');
    const songEl = document.getElementById('songBody');
    const paletteChips = document.getElementById('paletteChips');
    const keyboardEl = document.getElementById('keyboard');
    const whiteKeysEl = document.getElementById('whiteKeys');
    const currentKeyLabel = document.getElementById('currentKeyLabel');
    const lyricsText = document.getElementById('lyricsText');
    const builderRootsEl = document.getElementById('builderRoots');
    const builderQualitiesEl = document.getElementById('builderQualities');
    const builderBassEl = document.getElementById('builderBass');
    const builderPreviewChip = document.getElementById('builderPreviewChip');
    const builderAddBtn = document.getElementById('builderAddBtn');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmYesBtn = document.getElementById('confirmYesBtn');
    const confirmNoBtn = document.getElementById('confirmNoBtn');
    const toastEl = document.getElementById('toast');
    const songTitleInput = document.getElementById('songTitle');
    const songArtistInput = document.getElementById('songArtist');
    const libraryListEl = document.getElementById('libraryList');
    const libraryNoteEl = document.getElementById('libraryNote');
    const fileInput = document.getElementById('fileInput');

    let toastTimer = null;
    function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
    }
    let confirmResolve = null;
    function showConfirm(message) {
        return new Promise(resolve => {
            confirmMessage.textContent = message;
            confirmOverlay.classList.add('visible');
            confirmResolve = resolve;
        });
    }
    confirmYesBtn.addEventListener('click', () => {
        confirmOverlay.classList.remove('visible');
        if (confirmResolve) confirmResolve(true);
    });
    confirmNoBtn.addEventListener('click', () => {
        confirmOverlay.classList.remove('visible');
        if (confirmResolve) confirmResolve(false);
    });

    function normalizeRoot(root) {
        return root.replace(/Db/g,'C#').replace(/Eb/g,'D#')
                   .replace(/Gb/g,'F#').replace(/Ab/g,'G#')
                   .replace(/Bb/g,'A#');
    }
    function transposeChord(chord, semitones) {
        const m = chord.match(/^([A-G][#b]?)(.*)$/);
        if (!m) return chord;
        const idx = NOTES_SHARP.indexOf(normalizeRoot(m[1]));
        if (idx === -1) return chord;
        const newIdx = ((idx + semitones) % 12 + 12) % 12;
        return NOTES_SHARP[newIdx] + m[2];
    }
    function getDiatonicChords(key) {
        const rootIdx = NOTES_SHARP.indexOf(normalizeRoot(key));
        if (rootIdx === -1) return [];
        return MAJOR_INTERVALS.map((interval, i) =>
            NOTES_SHARP[(rootIdx + interval) % 12] + CHORD_QUALITIES[i]
        );
    }
    function chordQualityClass(chord) {
        if (chord.endsWith('dim')) return 'dim';
        if (/m(?!aj)/.test(chord)) return 'minor';
        return '';
    }
    function composedChordText() {
        return builder.root + builder.quality + (builder.bass ? '/' + builder.bass : '');
    }

    function createGhost(text, x, y) {
        const g = document.createElement('div');
        g.className = 'ghost';
        g.textContent = text;
        g.style.left = x + 'px';
        g.style.top = y + 'px';
        document.body.appendChild(g);
        return g;
    }
    function updateGhost(ghost, x, y) {
        ghost.style.left = x + 'px';
        ghost.style.top = y + 'px';
    }
    function findCharAt(x, y) {
        const el = document.elementFromPoint(x, y);
        return el && el.closest ? el.closest('.char') : null;
    }
    function swallowNextClick() {
        document.addEventListener('click', e => {
            if (e.target.closest && e.target.closest('.song')) e.stopPropagation();
        }, { capture: true, once: true });
    }
    function startDrag(e, sourceEl, getChordText, onDrop) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        const startX = e.clientX, startY = e.clientY;
        const chordText = getChordText();
        if (!chordText) return;

        let dragging = false, ghost = null, lastTarget = null;

        function onMove(ev) {
            if (!dragging) {
                if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < DRAG_THRESHOLD) return;
                dragging = true;
                sourceEl.classList.add('dragging');
                ghost = createGhost(chordText, ev.clientX, ev.clientY);
            }
            updateGhost(ghost, ev.clientX, ev.clientY);
            const target = findCharAt(ev.clientX, ev.clientY);
            if (lastTarget && lastTarget !== target) lastTarget.classList.remove('dragover');
            if (target) { target.classList.add('dragover'); lastTarget = target; }
            else lastTarget = null;
        }
        function onUp() {
            try { sourceEl.releasePointerCapture(e.pointerId); } catch (err) {}
            sourceEl.removeEventListener('pointermove', onMove);
            sourceEl.removeEventListener('pointerup', onUp);
            sourceEl.removeEventListener('pointercancel', onUp);
            sourceEl.classList.remove('dragging');
            if (ghost) ghost.remove();
            if (lastTarget) lastTarget.classList.remove('dragover');
            if (dragging) {
                swallowNextClick();
                if (lastTarget) {
                    const line = parseInt(lastTarget.dataset.line, 10);
                    const char = parseInt(lastTarget.dataset.char, 10);
                    onDrop(line, char);
                }
            }
        }
        try { sourceEl.setPointerCapture(e.pointerId); } catch (err) {}
        sourceEl.addEventListener('pointermove', onMove);
        sourceEl.addEventListener('pointerup', onUp);
        sourceEl.addEventListener('pointercancel', onUp);
    }

    function renderPalette() {
        paletteChips.innerHTML = '';
        getDiatonicChords(state.key).forEach(chord => {
            const chip = document.createElement('div');
            chip.className = 'chord-chip ' + chordQualityClass(chord);
            chip.textContent = chord;
            chip.addEventListener('pointerdown', e => {
                startDrag(e, chip, () => chord, (line, char) => addChord(line, char, chord));
            });
            chip.addEventListener('click', () => {
                if (state.selectedChar) {
                    addChord(state.selectedChar.line, state.selectedChar.char, chord);
                } else {
                    showToast('Klicka på en bokstav i texten först');
                }
            });
            paletteChips.appendChild(chip);
        });
        currentKeyLabel.textContent = state.key;
    }

    function renderKeyboard() {
        whiteKeysEl.innerHTML = '';
        ['C','D','E','F','G','A','B'].forEach(note => {
            const k = document.createElement('div');
            k.className = 'piano-key white' + (note === state.key ? ' active' : '');
            k.title = note;
            k.addEventListener('click', () => setKey(note));
            whiteKeysEl.appendChild(k);
        });
        keyboardEl.querySelectorAll('.piano-key.black').forEach(el => el.remove());
        const blackPositions = { 'C#': 1, 'D#': 2, 'F#': 4, 'G#': 5, 'A#': 6 };
        Object.entries(blackPositions).forEach(([note, pos]) => {
            const k = document.createElement('div');
            k.className = 'piano-key black' + (note === state.key ? ' active' : '');
            k.title = note;
            k.style.left = `calc(${pos} * 100% / 7 - 7px)`;
            k.addEventListener('click', () => setKey(note));
            keyboardEl.appendChild(k);
        });
    }
    function setKey(newKey) {
        state.key = newKey;
        renderPalette(); renderKeyboard(); save();
    }

    function renderBuilder() {
        builderRootsEl.innerHTML = '';
        NOTES_SHARP.forEach(note => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'mini-chip' + (builder.root === note ? ' active' : '');
            chip.textContent = note;
            chip.addEventListener('click', () => { builder.root = note; renderBuilder(); });
            builderRootsEl.appendChild(chip);
        });
        builderQualitiesEl.innerHTML = '';
        BUILDER_QUALITIES.forEach(q => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'mini-chip' + (builder.quality === q.value ? ' active' : '');
            chip.textContent = q.label;
            chip.addEventListener('click', () => { builder.quality = q.value; renderBuilder(); });
            builderQualitiesEl.appendChild(chip);
        });
        builderBassEl.innerHTML = '';
        const noneChip = document.createElement('button');
        noneChip.type = 'button';
        noneChip.className = 'mini-chip none-chip' + (builder.bass === null ? ' active' : '');
        noneChip.textContent = 'ingen';
        noneChip.addEventListener('click', () => { builder.bass = null; renderBuilder(); });
        builderBassEl.appendChild(noneChip);
        NOTES_SHARP.forEach(note => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'mini-chip' + (builder.bass === note ? ' active' : '');
            chip.textContent = note;
            chip.addEventListener('click', () => { builder.bass = note; renderBuilder(); });
            builderBassEl.appendChild(chip);
        });
        builderPreviewChip.textContent = composedChordText();
    }
    builderPreviewChip.addEventListener('pointerdown', e => {
        startDrag(e, builderPreviewChip, composedChordText,
            (line, char) => addChord(line, char, composedChordText()));
    });
    builderAddBtn.addEventListener('click', () => {
        if (!state.selectedChar) {
            showToast('Klicka på en bokstav i texten först!');
            return;
        }
        addChord(state.selectedChar.line, state.selectedChar.char, composedChordText());
    });

    function renderSong() {
        if (state.title || state.artist) {
            songHeaderEl.classList.remove('empty');
            songHeaderEl.innerHTML = '';
            if (state.artist) {
                const artistEl = document.createElement('div');
                artistEl.className = 'artist';
                artistEl.textContent = state.artist;
                songHeaderEl.appendChild(artistEl);
            }
            if (state.title) {
                const titleEl = document.createElement('div');
                titleEl.className = 'title';
                titleEl.textContent = state.title;
                songHeaderEl.appendChild(titleEl);
            }
        } else {
            songHeaderEl.classList.add('empty');
            songHeaderEl.innerHTML = '';
        }

        songEl.innerHTML = '';
        const lines = state.lyrics.split('\n');
        lines.forEach((lineText, lineIdx) => {
            const lineEl = document.createElement('div');
            lineEl.className = 'line';
            const chars = Array.from(lineText);

            const endChords = state.chords
                .filter(c => c.line === lineIdx && c.char >= chars.length)
                .sort((a, b) => a.char - b.char);

            let charIdx = 0, i = 0;
            while (i < chars.length) {
                const isSpace = /\s/.test(chars[i]);
                let j = i;
                while (j < chars.length && /\s/.test(chars[j]) === isSpace) j++;
                const wrap = document.createElement('span');
                wrap.className = 'word-wrap';
                for (let k = i; k < j; k++) {
                    const ch = chars[k];
                    const idx = charIdx;
                    const charEl = document.createElement('span');
                    charEl.className = 'char' + (isSpace ? ' space' : '');
                    charEl.dataset.line = lineIdx;
                    charEl.dataset.char = idx;

                    if (state.selectedChar &&
                        state.selectedChar.line === lineIdx &&
                        state.selectedChar.char === idx) {
                        charEl.classList.add('selected');
                    }

                    const lyricEl = document.createElement('span');
                    lyricEl.className = 'lyric';
                    lyricEl.textContent = ch === ' ' ? '\u00A0' : ch;
                    lyricEl.addEventListener('click', () => selectChar(lineIdx, idx));
                    charEl.appendChild(lyricEl);

                    const chord = state.chords.find(c =>
                        c.line === lineIdx && c.char === idx);
                    if (chord) {
                        const chordEl = document.createElement('span');
                        chordEl.className = 'chord';
                        chordEl.textContent = chord.chord;
                        chordEl.title = 'Dra för att flytta, Ctrl+klick för att ta bort';
                        chordEl.addEventListener('pointerdown', e => {
                            e.stopPropagation();
                            startDrag(e, chordEl, () => chord.chord, (newLine, newChar) => {
                                moveChord(lineIdx, idx, newLine, newChar, chord.chord);
                            });
                        });
                        chordEl.addEventListener('click', e => {
                            e.stopPropagation();
                            if (e.ctrlKey || e.metaKey) removeChord(lineIdx, idx);
                            else selectChar(lineIdx, idx);
                        });
                        charEl.appendChild(chordEl);
                    }

                    wrap.appendChild(charEl);
                    charIdx++;
                }
                lineEl.appendChild(wrap);
                i = j;
            }

            endChords.forEach(chord => {
                const charEl = document.createElement('span');
                charEl.className = 'char';
                charEl.dataset.line = lineIdx;
                charEl.dataset.char = chord.char;

                if (state.selectedChar &&
                    state.selectedChar.line === lineIdx &&
                    state.selectedChar.char === chord.char) {
                    charEl.classList.add('selected');
                }

                const lyricEl = document.createElement('span');
                lyricEl.className = 'lyric spacer';
                lyricEl.textContent = chord.chord;
                lyricEl.addEventListener('click', () => selectChar(lineIdx, chord.char));
                charEl.appendChild(lyricEl);

                const chordEl = document.createElement('span');
                chordEl.className = 'chord';
                chordEl.textContent = chord.chord;
                chordEl.title = 'Dra för att flytta, Ctrl+klick för att ta bort';
                chordEl.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    startDrag(e, chordEl, () => chord.chord, (newLine, newChar) => {
                        moveChord(lineIdx, chord.char, newLine, newChar, chord.chord);
                    });
                });
                chordEl.addEventListener('click', e => {
                    e.stopPropagation();
                    if (e.ctrlKey || e.metaKey) removeChord(lineIdx, chord.char);
                    else selectChar(lineIdx, chord.char);
                });
                charEl.appendChild(chordEl);

                lineEl.appendChild(charEl);
            });

            if (lineText === '' && lineEl.children.length === 0) {
                lineEl.innerHTML = '&nbsp;';
            }
            songEl.appendChild(lineEl);
        });
    }

    function selectChar(line, char) {
        state.selectedChar = { line, char };
        renderSong();
    }
    function addChord(line, char, chordText) {
        state.chords = state.chords.filter(c =>
            !(c.line === line && c.char === char));
        state.chords.push({ line, char, chord: chordText });
        renderSong(); save();
    }
    function moveChord(fromLine, fromChar, toLine, toChar, chordText) {
        if (fromLine === toLine && fromChar === toChar) return;
        state.chords = state.chords.filter(c =>
            !(c.line === fromLine && c.char === fromChar) &&
            !(c.line === toLine && c.char === toChar));
        state.chords.push({ line: toLine, char: toChar, chord: chordText });
        renderSong(); save();
    }
    function removeChord(line, char) {
        state.chords = state.chords.filter(c =>
            !(c.line === line && c.char === char));
        renderSong(); save();
    }

    function transposeAll(semitones) {
        state.chords = state.chords.map(c =>
            ({ ...c, chord: transposeChord(c.chord, semitones) }));
        const idx = NOTES_SHARP.indexOf(normalizeRoot(state.key));
        if (idx !== -1) {
            state.key = NOTES_SHARP[((idx + semitones) % 12 + 12) % 12];
        }
        renderSong(); renderPalette(); renderKeyboard(); save();
    }

    function applyLyrics() {
        const newLyrics = lyricsText.value;
        const lineCount = newLyrics.split('\n').length;
        state.chords = state.chords.filter(c => c.line < lineCount);
        state.lyrics = newLyrics;
        state.selectedChar = null;
        renderSong(); save();
    }
    function resetLyrics() {
        lyricsText.value = state.lyrics;
        showToast('Återställd');
    }

    function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch (e) { console.warn('Kunde inte spara:', e); }
    }
    function load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (data && typeof data.lyrics === 'string' && Array.isArray(data.chords)) {
                state.title = data.title || 'Min låt';
                state.artist = data.artist || '';
                state.lyrics = data.lyrics;
                state.chords = data.chords;
                state.key = data.key || 'C';
                state.selectedChar = null;
                return true;
            }
        } catch (e) { console.warn('Kunde inte läsa:', e); }
        return false;
    }

    function fsSupported() {
        return typeof window.showDirectoryPicker === 'function';
    }

    async function pickLibrary() {
        if (!fsSupported()) {
            showToast('Mappval kräver Chromium-baserad webbläsare');
            return;
        }
        try {
            libraryDirHandle = await
